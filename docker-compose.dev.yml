# docker-compose de DESARROLLO LOCAL.
# Levanta la API (construida desde el codigo) + MySQL, para que cualquier dev
#
#   docker compose -f docker-compose.dev.yml up --build
#
# API:      http://localhost:8080
# Swagger:  http://localhost:8080/swagger-ui.html   (activo: perfil 'default')
# MySQL:    localhost:3307  (usuario/clave de dev, abajo)

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: medicitas
      MYSQL_USER: medicitas
      MYSQL_PASSWORD: medicitas
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"          # expuesto por si el dev quiere conectarse con un cliente
    volumes:
      - medicitas_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - medicitas-dev

  api:
    build:
      context: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default   # Swagger habilitado en local
      DB_URL: jdbc:mysql://mysql:3306/medicitas
      DB_USERNAME: medicitas
      DB_PASSWORD: medicitas
      FLYWAY_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - medicitas-dev

volumes:
  medicitas_dev_data:

networks:
  medicitas-dev:
    driver: bridge
