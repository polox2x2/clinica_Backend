# ============================================================================
# CI/CD MediCitas Backend (Spring Boot 4 / Java 21 / MySQL)
#
# Modelo de ramas:  feature/* -> develop -> staging -> main
#   - develop : solo valida (no construye imagen ni despliega)
#   - staging : valida + construye/publica imagen (sin desplegar)
#   - main    : valida + construye/publica imagen + despliega a PRODUCCION
# Promocion por artefacto: la imagen se construye una vez y se etiqueta con el
# SHA del commit; esa misma imagen es la que se despliega.
# ============================================================================
name: CI-CD Backend

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

# Cancela ejecuciones anteriores en curso para el mismo ref
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Etapa 1: Deteccion de secretos (Gitleaks). Corta si hay credenciales.
  # --------------------------------------------------------------------------
  secretos:
    name: Deteccion de secretos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Etapas 2-5: Compilacion, pruebas unitarias, pruebas de integracion
  # (Testcontainers + MySQL) y cobertura (JaCoCo).
  # --------------------------------------------------------------------------
  pruebas:
    name: Compilacion y pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter publica el reporte
      pull-requests: write # madrapps/jacoco-report comenta cobertura en el PR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (temurin) con cache de Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilacion (empaquetado sin pruebas)
        run: mvn -B clean package -DskipTests

      - name: Pruebas unitarias
        run: mvn -B test

      - name: Pruebas de integracion (Testcontainers + MySQL)
        run: mvn -B verify -Pintegration

      - name: Publicar reporte de pruebas
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Reporte de pruebas
          path: "target/surefire-reports/*.xml,target/failsafe-reports/*.xml"
          reporter: java-junit

      - name: Comentar cobertura en el PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 80

  # --------------------------------------------------------------------------
  # Etapa 6: Analisis de calidad con SonarQube (servidor propio) + Quality Gate.
  # --------------------------------------------------------------------------
  calidad:
    name: Analisis de calidad
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar necesita el historial para 'codigo nuevo'

      - name: Configurar JDK 21 (temurin) con cache de Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache de SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analisis SonarQube
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify sonar:sonar
          -Dsonar.projectKey=MedicitasBackend
          -Dsonar.host.url=$SONAR_HOST_URL
          -Dsonar.token=$SONAR_TOKEN

      - name: Verificar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # --------------------------------------------------------------------------
  # Etapa 7: Analisis de dependencias (OWASP Dependency-Check). Corta si CVSS>=8.
  # --------------------------------------------------------------------------
  dependencias:
    name: Analisis de dependencias
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (temurin) con cache de Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: OWASP Dependency-Check
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8

      - name: Subir reporte OWASP (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check
          path: target/dependency-check-report.html

  # --------------------------------------------------------------------------
  # Etapas 8-10: Construccion de imagen, escaneo (Trivy) y publicacion en GHCR.
  # Solo en push a main o staging. El escaneo ocurre ANTES del push.
  # --------------------------------------------------------------------------
  imagen:
    name: Construccion y publicacion de imagen
    needs: [secretos, calidad, dependencias]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # unico job que publica en GHCR
    env:
      IMAGEN: ghcr.io/${{ github.repository }}/medicitas-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construir cargando en el daemon local (load), SIN publicar todavia
      - name: Construir imagen (load, sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGEN }}:${{ github.sha }}

      # Escanear la imagen local ANTES de publicarla
      - name: Escaneo de imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGEN }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # Recien despues del escaneo: publicar con dos tags (SHA + nombre de rama)
      - name: Publicar imagen (SHA + rama)
        run: |
          RAMA="${GITHUB_REF_NAME}"
          docker tag "${IMAGEN}:${GITHUB_SHA}" "${IMAGEN}:${RAMA}"
          docker push "${IMAGEN}:${GITHUB_SHA}"
          docker push "${IMAGEN}:${RAMA}"

  # --------------------------------------------------------------------------
  # Etapas 13-15: Despliegue a PRODUCCION en Railway usando la imagen ya
  # validada de GHCR (promocion por artefacto). Requiere aprobacion manual via
  # GitHub Environments. Verificacion por health-check y rollback al SHA anterior.
  # --------------------------------------------------------------------------
  deploy-produccion:
    name: Despliegue a produccion
    needs: imagen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # gate de aprobacion manual
    permissions:
      contents: read
    env:
      IMAGEN: ghcr.io/${{ github.repository }}/medicitas-api
    steps:
      - name: Checkout (2 commits para resolver HEAD~1)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      # Despliega en Railway la imagen de GHCR etiquetada con el SHA actual.
      # Requisitos de configuracion (una sola vez):
      #   - El servicio de Railway debe tener como origen la imagen GHCR
      #     ghcr.io/<repo>/medicitas-api y leer el tag desde la variable IMAGE_TAG.
      #   - Secrets: RAILWAY_TOKEN (token de proyecto), RAILWAY_SERVICE (nombre/id
      #     del servicio) y PRODUCTION_URL (dominio publico del servicio).
      - name: Desplegar imagen en Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          echo "Desplegando ${IMAGEN}:${GITHUB_SHA} en Railway"
          railway variables --service "$RAILWAY_SERVICE" --set "IMAGE_TAG=${GITHUB_SHA}"
          railway redeploy --service "$RAILWAY_SERVICE" --yes

      - name: Verificar salud de produccion
        id: healthcheck
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          # Si aun no existe el dominio publico (primer deploy), se omite la
          # verificacion en vez de fallar. Configura PRODUCTION_URL tras el
          # primer deploy para activar el health check y el rollback.
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_URL no configurado: se omite el health check (primer deploy)."
            exit 0
          fi
          echo "Esperando que produccion reporte UP..."
          for i in $(seq 1 12); do
            if curl -fsS "${PRODUCTION_URL}/actuator/health" | grep -q '"status":"UP"'; then
              echo "Produccion OK en el intento $i"
              exit 0
            fi
            echo "Intento $i/12 sin exito; reintentando en 10s..."
            sleep 10
          done
          echo "La verificacion de salud fallo tras 12 intentos"
          exit 1

      # Rollback: si el health-check fallo, redesplegar el SHA anterior (HEAD~1)
      - name: Rollback al despliegue anterior
        if: failure() && steps.healthcheck.outcome == 'failure'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          PREV_SHA="$(git rev-parse HEAD~1)"
          echo "Rollback: redeploy de ${IMAGEN}:${PREV_SHA}"
          railway variables --service "$RAILWAY_SERVICE" --set "IMAGE_TAG=${PREV_SHA}"
          railway redeploy --service "$RAILWAY_SERVICE" --yes

      # Resumen siempre visible en la pestana Summary del run
      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## Resumen de despliegue a produccion"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Autor | ${GITHUB_ACTOR} |"
            echo "| Imagen | \`${IMAGEN}:${GITHUB_SHA}\` |"
            echo "| Resultado | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
