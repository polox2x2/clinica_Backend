version: 2
updates:
  # Dependencias Maven del backend
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Agrupa todas las actualizaciones Maven en un solo PR (menos ruido de CI)
    groups:
      maven-dependencies:
        patterns:
          - "*"

  # Actions usadas en los workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  # Imagenes base del Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    groups:
      docker-images:
        patterns:
          - "*"
