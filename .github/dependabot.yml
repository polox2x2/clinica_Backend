version: 2
updates:
  # Dependencias Maven del backend
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Actions usadas en los workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  # Imagenes base del Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
