spring:
  application:
    name: Practica01
  config:
    import: optional:file:.env[.properties]
  # Perfil activo configurable (staging/prod lo inyecta el contenedor)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:medicitas}}
    username: ${DB_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:root}}}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      # Flyway administra el esquema; Hibernate solo valida que coincida.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        dialect: ${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
  # Flyway administra las migraciones de esquema (src/main/resources/db/migration)
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

# Swagger / OpenAPI: habilitado en local, se apaga en prod (application-prod.yaml)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# Puerto del servidor (Railway suele inyectar PORT)
server:
  port: ${PORT:8080}

# Actuator: endpoints para healthchecks, metricas y scraping de Prometheus
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:always}
      probes:
        enabled: true

# Configuracion propia de la aplicacion
app:
  cors:
    # Lista de origenes permitidos, separados por coma. Configurable por entorno.
    # Ej: CORS_ALLOWED_ORIGINS=https://app.midominio.com,https://admin.midominio.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Clave HS256 (min 32 bytes). En prod usar JWT_SECRET como secret.
    secret: ${JWT_SECRET:medicitas-dev-secret-key-change-me-please-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  auth:
    default-role: ${AUTH_DEFAULT_ROLE:Paciente}
    cookie:
      name: ${AUTH_COOKIE_NAME:access_token}
      # En local: secure=false, SameSite=Lax. En prod cross-subdominio:
      # secure=true, same-site=None (o domain=.lmart.dev con Lax).
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAMESITE:Lax}
      domain: ${AUTH_COOKIE_DOMAIN:}
      max-age-seconds: ${AUTH_COOKIE_MAX_AGE:86400}
